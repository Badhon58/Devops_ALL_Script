apiVersion: apps/v1
kind: Deployment
metadata:
  name: online
spec:
  replicas: 3
  selector:
    matchLabels:
      app: online
  template:
    metadata:
      labels:
        app: online
    spec:
      containers:
        - name: online-pod
          image: amitabhdevops/online_shop:latest
          ports:
            - containerPort: 3000
