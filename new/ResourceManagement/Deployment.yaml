apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-resources
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  templete:
    metadata:
      labels:
        name: nginx-pod
    spec:
      nodeName: badhon
      nodeSelector:
        team: analytic
      container:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
          resources:
            request:
              memory: "200Mi"
              cpu: "1"
            limit:
              memory: "2Gi"
              cpu: "1"
          # env:
          #   - name: hello
          #     value: "hello"
        